events {
  worker_connections 4096;
}

http {
  # ─── Upstreams (supports horizontal scaling via DNS round-robin) ─────────────
  # In Phase 10, add multiple API servers here:
  #   server api_1:8000;
  #   server api_2:8000;
  upstream api_upstream {
    server api:8000;
    keepalive 32;
  }

  upstream notification_upstream {
    server notification:8001;
    keepalive 32;
  }

  upstream frontend_upstream {
    server frontend:5173;
  }

  # ─── Server ──────────────────────────────────────────────────────────────────
  server {
    listen 80;
    server_name localhost;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ─── API (prefix /api/ stripped before forwarding to Express) ──────────────
    location /api/ {
      proxy_pass         http://api_upstream/;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;

      # Large file uploads (Phase 2)
      client_max_body_size 110m;
      proxy_request_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    # ─── WebSocket / Socket.IO (Notification Service) ──────────────────────────
    location /socket.io/ {
      proxy_pass         http://notification_upstream/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
      proxy_set_header   X-Real-IP  $remote_addr;
      proxy_read_timeout 86400s;
    }

    # ─── Frontend (Vite dev server with HMR WebSocket) ─────────────────────────
    location / {
      proxy_pass         http://frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
